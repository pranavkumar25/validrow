# Local stack running on the *production* backends: Postgres, Redis and an
# S3-compatible store. Useful precisely because it is not the default path —
# `make run` uses SQLite and local disk, so this is where you find out whether
# the shared-backend code works before a deploy does.
#
# The worker is a separate service on purpose: that is the split a real
# deployment has, where probe workers sit on port-25-capable egress hosts.
services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment: &backends
      EVE_WORKSPACE_DB_URL: postgresql+asyncpg://eve:eve@postgres:5432/eve
      EVE_REDIS_URL: redis://redis:6379/0
      EVE_S3_ENDPOINT: http://minio:9000
      EVE_S3_ACCESS_KEY: minioadmin
      EVE_S3_SECRET_KEY: minioadmin
      EVE_S3_BUCKET: eve-uploads
    depends_on:
      - postgres
      - redis
      - minio
      - createbucket

  # Bulk jobs run here rather than in the API, so an API restart cannot orphan
  # a run half-way through.
  worker:
    build: .
    command: ["arq", "eve.jobs.worker.WorkerSettings"]
    env_file:
      - .env.example
    environment: *backends
    depends_on:
      - postgres
      - redis
      - minio

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: eve
      POSTGRES_PASSWORD: eve
      POSTGRES_DB: eve
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # S3 has no "create on first write", so the bucket has to exist up front.
  createbucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/eve-uploads;
      "

volumes:
  pgdata:
  miniodata:
