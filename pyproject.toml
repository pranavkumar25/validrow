[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "email-validation-engine"
version = "0.1.0"
description = "In-house email verification engine (syntax → normalize → typo → MX → classify → SMTP)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Pranav Kumar" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "dnspython>=2.6",
    "aiosmtplib>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.9",
    # Webhook delivery. Core rather than optional: a job that reports itself
    # complete to nobody is a broken feature, not a deployment choice.
    "httpx>=0.27",
    # Server-rendered web app (served by the same process as the API).
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Production backends — imported lazily so they are not required for local dev.
s3 = ["aioboto3>=12.0"]
redis = ["redis>=5.0"]
postgres = ["asyncpg>=0.29"]
worker = ["arq>=0.26"]
sentry = ["sentry-sdk[fastapi]>=2.0"]
# The web app ships with the engine (jinja2 is a core dependency); there is no
# separate front-end process and no extra to install.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosmtpd>=1.4",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
eve = ["data/*.txt", "migrations/*.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares query/form/body parameters by calling Query()/Form()/Depends()
# in the default. That is the framework's documented signature style, not the
# mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Query", "fastapi.Form", "fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.pyupgrade]
# Keep typing-module annotations (Optional/List/Dict) intact — Pydantic models
# evaluate annotations at runtime and must stay Python 3.9-compatible.
keep-runtime-typing = true

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
