[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "validrow"
version = "0.1.0"
description = "In-house email verification engine (syntax → normalize → typo → MX → classify → SMTP)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Pranav Kumar" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "email-validator>=2.1",
    "dnspython>=2.6",
    "aiosmtplib>=3.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.19",
    "python-multipart>=0.0.9",
    # Webhook delivery. Core rather than optional: a job that reports itself
    # complete to nobody is a broken feature, not a deployment choice.
    "httpx>=0.27",
    # Server-rendered web app (served by the same process as the API).
    "jinja2>=3.1",
    # The three shared backends. These were extras, imported lazily so a local
    # checkout would not pull them, and that was the right shape until a
    # platform resolved dependencies from this list and ignored both the extras
    # and requirements.txt. A deploy then built cleanly and died in the
    # lifespan on `No module named 'asyncpg'`, which is a packaging decision
    # presenting as a crash. They cost about 20 MB and are now always present,
    # so an engine pointed at Postgres, S3 or Redis can reach them wherever it
    # runs. Which one is used is still decided by configuration at runtime.
    "asyncpg>=0.29",
    "aioboto3>=12.0",
    "redis>=5.0",
]

[project.optional-dependencies]
# Production backends — imported lazily so they are not required for local dev.
# Kept as names so `.[s3]` and `.[redis]` still resolve; the packages moved to
# the base list above.
s3 = []
redis = []
# asyncpg drives the app and is a base dependency. psycopg2 drives Alembic:
# migrations/env.py swaps "+asyncpg" for "+psycopg2" when Alembic opens its own
# connection, which is what `alembic upgrade head` does as a deploy step.
# Startup migrations reuse the app's connection and never take that path, so
# this is only needed on the command line, against a real database.
postgres = ["psycopg2-binary>=2.9"]
worker = ["arq>=0.26"]
sentry = ["sentry-sdk[fastapi]>=2.0"]
# The web app ships with the engine (jinja2 is a core dependency); there is no
# separate front-end process and no extra to install.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosmtpd>=1.4",
    "ruff>=0.4",
    "mypy>=1.9",
]

# Vercel resolves this against files in the repo rather than against installed
# modules, so it cannot use "eve.api.main" (there is no `eve/` at the root) and
# its own suggestion, "src.eve.api.main", loads the module under a name its
# absolute imports do not match. main.py at the root exists for this.
[tool.vercel]
entrypoint = "main:app"

[tool.setuptools.packages.find]
where = ["src"]

# Everything the package needs at runtime that is not a .py file. An editable
# install reads the source tree, so a gap here is invisible locally and only
# appears once a wheel is built: the web templates and static assets were
# missing, and `mount_web` raised at import time on the first real deploy.
# tests/test_packaging.py fails if a data file is added without a glob here.
[tool.setuptools.package-data]
eve = [
    "data/*.txt",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares query/form/body parameters by calling Query()/Form()/Depends()
# in the default. That is the framework's documented signature style, not the
# mutable-default bug B008 exists to catch.
extend-immutable-calls = ["fastapi.Query", "fastapi.Form", "fastapi.Depends", "fastapi.Body"]

[tool.ruff.lint.pyupgrade]
# Keep typing-module annotations (Optional/List/Dict) intact — Pydantic models
# evaluate annotations at runtime and must stay Python 3.9-compatible.
keep-runtime-typing = true

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
