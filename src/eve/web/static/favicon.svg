<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
<!--
  The validrow mark: the wordmark's own "va" under the two rules, which is what
  the logo already is once there is no room for the rest of the word.

  Square, because a favicon slot is. The art is 36.4 x 26.7, so it is centred in
  a 40 x 40 box rather than stretched to fill one.

  The letterforms follow the tab strip rather than fighting it: #0A0A0A on a
  light chrome, brand white on a dark one, since a black mark on a dark tab is
  an empty tab. The rules lift to a lighter blue in the dark case for the same
  reason - #0000FF against a near-black chrome is barely a mark at all.
-->
<style>
  .ink { fill: #0A0A0A }
  .rule { fill: #0000FF }
  @media (prefers-color-scheme: dark) {
    .ink { fill: #FCFCFC }
    .rule { fill: #6E6EFF }
  }
</style>
