# Alembic CLI config.
#
# The application does not use this file — the stores call
# `eve.migrations.run_migrations` on startup with a live connection. This exists
# so `alembic history`, `alembic downgrade` and `alembic revision` work from the
# repo root. The database URL is resolved by env.py from EVE_WORKSPACE_DB_URL.
[alembic]
script_location = src/eve/migrations
prepend_sys_path = src

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
